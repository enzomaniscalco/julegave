<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julegave 2026 – Uptime Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#12302a; --pine-2:#1b4238; --cream:#f6f1e7; --paper:#fffdf8;
    --ink:#1c2422; --muted:#5f6b67; --line:#e2dccd; --berry:#c2242b; --berry-2:#8e141c; --gold:#f2c66d;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--cream) radial-gradient(circle at 1px 1px,rgba(194,36,43,.07) 1.5px,transparent 0) 0 0/26px 26px;color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0,#d8323a 0,var(--berry) 45%,var(--berry-2) 100%);color:#fff;padding:78px 20px 110px;text-align:center}
  header>*{position:relative;z-index:2}
  .lys{position:absolute;top:0;left:0;right:0;height:34px;z-index:3;display:flex;justify-content:space-around;border-top:3px solid #0f2a24}
  .lys i{width:12px;height:16px;border-radius:50% 50% 55% 55%;margin-top:6px;animation:blink 2.4s ease-in-out infinite}
  .lys i:nth-child(4n+1){background:#ffd76a;box-shadow:0 0 12px 3px #ffd76a}
  .lys i:nth-child(4n+2){background:#7fe0a0;box-shadow:0 0 12px 3px #7fe0a0;animation-delay:.6s}
  .lys i:nth-child(4n+3){background:#fff;box-shadow:0 0 12px 3px #fff;animation-delay:1.2s}
  .lys i:nth-child(4n){background:#8fd3ff;box-shadow:0 0 12px 3px #8fd3ff;animation-delay:1.8s}
  .lys i:nth-child(odd){margin-top:12px}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .fonn{position:absolute!important;left:0;right:0;bottom:-1px;width:100%;height:70px;z-index:1!important;display:block}
  .sno{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  .sno span{position:absolute;top:-40px;color:#fff;text-shadow:0 0 6px rgba(120,160,190,.9);animation:fall linear infinite;will-change:transform}
  @keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.sno{display:none}.lys i{animation:none}}
  .eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--gold);font-weight:600}
  .eyebrow::before,.eyebrow::after{content:" ❄ ";color:#fff}
  h1{font:700 clamp(46px,10vw,84px)/1 'Mountains of Christmas',Fraunces,Georgia,serif;margin:12px 0 14px;text-shadow:0 3px 0 rgba(0,0,0,.18)}
  header p{max-width:560px;margin:0 auto;color:#ffe9e6}
  .frist{display:inline-block;margin-top:22px;padding:8px 16px;border:1px dashed rgba(255,255,255,.7);border-radius:999px;font-size:14px;color:#fff;background:rgba(0,0,0,.14)}
  main{position:relative;z-index:2;max-width:1080px;margin:-44px auto 0;padding:0 16px 300px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .card{position:relative;display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
  .card:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 10px 24px rgba(18,48,42,.10)}
  .card:nth-child(even):hover{transform:translateY(-4px) rotate(.6deg)}
  .card:has(input:checked)::after{content:"🎁 Valgt";position:absolute;top:12px;right:12px;background:var(--berry);color:#fff;font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.2);animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.5) rotate(-12deg);opacity:0}}
  .card input{position:absolute;opacity:0;pointer-events:none}
  .card:has(input:checked){border-color:var(--berry);border-style:dashed;box-shadow:0 10px 28px rgba(179,57,47,.18)}
  .card:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
  .img{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#fff 0 22px,#f7d4d4 22px 44px);display:grid;place-items:center;font-size:84px}
  .img img{width:100%;height:100%;object-fit:cover;display:block}
  .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .nr{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--berry);font-weight:600}
  .nr::before{content:"❄ "}
  h2{font:600 22px/1.2 Fraunces,Georgia,serif;margin:0}
  .desc{color:var(--muted);font-size:15px;margin:0;flex:1}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px}
  .meta a{color:var(--pine-2);font-weight:500}
  .pick{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--pine-2)}
  .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--pine-2);display:grid;place-items:center}
  .card:has(input:checked) .dot{border-color:var(--berry);background:var(--berry)}
  .card:has(input:checked) .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
  .card:has(input:checked) .pick{color:var(--berry)}
  .bar{position:fixed;z-index:6;left:0;right:0;bottom:0;background:var(--paper);border-top:4px solid transparent;border-image:repeating-linear-gradient(135deg,var(--berry) 0 12px,#fff 12px 24px) 4;box-shadow:0 -8px 24px rgba(18,48,42,.08);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  form{max-width:1080px;margin:0 auto;display:grid;gap:10px;grid-template-columns:1fr 1fr auto;align-items:end}
  .ekstra{grid-column:1/-1}
  @media (min-width:641px){.ekstra{order:3}form button{order:2}.msg{order:4}}
  .valgt{grid-column:1/-1;font-size:14px;color:var(--muted)}
  .valgt b{color:var(--ink)}
  label.f{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
  input[type=text]{font:inherit;padding:11px 12px;border:1px solid #cfc8b6;border-radius:10px;background:#fff;color:var(--ink);width:100%}
  input[type=text]:focus{outline:2px solid var(--pine-2);border-color:var(--pine-2)}
  button{font:600 16px Inter,sans-serif;padding:12px 22px;border:0;border-radius:10px;background:var(--berry);color:#fff;cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.55;cursor:not-allowed}
  .msg{grid-column:1/-1;font-size:14px;margin:0;min-height:0}
  .msg.err{color:var(--berry)} .msg.ok{color:var(--pine-2);font-weight:600}
  .takk{max-width:560px;margin:40px auto;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:36px 24px}
  .takk h2{font-size:30px;margin-bottom:10px}
  .takk button{margin-top:18px;background:transparent;color:var(--pine-2);border:1px solid var(--pine-2)}
  footer{text-align:center;color:var(--muted);font-size:14px;margin-top:32px}
  [hidden]{display:none!important}
  @media (max-width:640px){form{grid-template-columns:1fr 1fr}form button{grid-column:1/-1}}
</style>
</head>

<div class="sno" id="sno" aria-hidden="true"></div>

<header>
  <div class="lys" id="lys" aria-hidden="true"></div>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="tittel"></h1>
  <p id="intro"></p>

</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="takk" id="takk" hidden>
    <h2>🎄 Takk – ønsket er registrert</h2>
    <p id="takkTekst"></p>
    <button type="button" id="endre">Endre valget mitt</button>
  </div>
  <footer id="bunn"></footer>
</main>

<div class="bar" id="bar">
  <form id="skjema" novalidate>
    <div class="valgt" id="valgt">Velg en gave over.</div>

    <label class="f">Etternavn *<input type="text" id="etternavn" autocomplete="family-name" maxlength="60" required></label>
    <label class="f ekstra" id="ekstraFelt" hidden><span id="ekstraTekst"></span><input type="text" id="ekstra" maxlength="80"></label>
    <button type="submit" id="send">Send ønske</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</div>

// Julelys og snø (snøen skrus av for de som har bedt om mindre bevegelse)
for (let i = 0; i < 18; i++) document.getElementById("lys").appendChild(document.createElement("i"));
for (let i = 0; i < 34; i++) {
  const f = document.createElement("span");
  f.textContent = ["❄", "❅", "❆", "•"][i % 4];
  f.style.left = Math.random() * 100 + "%";
  f.style.fontSize = 10 + Math.random() * 18 + "px";
  f.style.opacity = .5 + Math.random() * .5;
  f.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
  f.style.animationDuration = 9 + Math.random() * 12 + "s";
  f.style.animationDelay = -Math.random() * 20 + "s";
  document.getElementById("sno").appendChild(f);
}
const $ = id => document.getElementById(id);
const LS = "julegave2026";
const lagret = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
const lagre = v => { try { localStorage.setItem(LS, JSON.stringify(v)); } catch (e) {} };

$("eyebrow").textContent = CONFIG.eyebrow;
$("tittel").textContent = CONFIG.tittel;
$("intro").textContent = CONFIG.intro;
$("bunn").textContent = CONFIG.bunn;

let stengt = false;
if (CONFIG.frist) {
  const slutt = new Date(CONFIG.frist + "T23:59:59");
  const dato = slutt.toLocaleDateString("nb-NO", { day: "numeric", month: "long" });
  stengt = Date.now() > slutt.getTime();
  $("frist").textContent = stengt ? "Fristen gikk ut " + dato : "Send inn innen " + dato;
  $("frist").hidden = false;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

GAVER.forEach((g, i) => {
  const card = el("label", "card");
  const radio = el("input"); radio.type = "radio"; radio.name = "gave"; radio.value = i + 1;
  const img = el("div", "img", g.ikon || "🎁");
  if (g.bilde) {
    const im = new Image(); im.alt = g.navn;
    im.onload = () => { img.textContent = ""; img.appendChild(im); };
    im.src = g.bilde;
  }
  const body = el("div", "body");
  body.append(el("div", "nr", "Alternativ " + (i + 1)), el("h2", "", g.navn), el("p", "desc", g.beskrivelse));
  const meta = el("div", "meta");
  const pick = el("span", "pick"); pick.append(el("span", "dot"), el("span", "", "Velg denne"));
  meta.append(pick);
  const hoyre = el("span");
  if (g.pris) hoyre.append(el("span", "", g.pris + (g.lenke ? " · " : "")));
  if (g.lenke) { const a = el("a", "", "Se produktet"); a.href = g.lenke; a.target = "_blank"; a.rel = "noopener"; hoyre.append(a); }
  meta.append(hoyre);
  body.append(meta);
  card.append(radio, img, body);
  $("grid").append(card);
  radio.addEventListener("change", oppdaterValgt);
});

function valgtNr() {
  const r = document.querySelector('input[name="gave"]:checked');
  return r ? Number(r.value) : 0;
}
function oppdaterValgt() {
  const n = valgtNr();
  $("valgt").innerHTML = "";
  if (n) { $("valgt").append("Du har valgt: ", el("b", "", GAVER[n - 1].navn)); }
  else $("valgt").textContent = "Velg en gave over.";
  const sp = n ? GAVER[n - 1].fritekst : "";
  $("ekstraFelt").hidden = !sp;
  if (sp) $("ekstraTekst").textContent = sp;
}
function melding(tekst, type) { $("msg").textContent = tekst; $("msg").className = "msg " + (type || ""); }

function visTakk(s) {
  $("takkTekst").textContent = s.fornavn + ", du har ønsket deg «" + s.gaveNavn + (s.kommentar ? " – " + s.kommentar : "") + "»." + (stengt ? "" : " Du kan endre valget frem til fristen.");
  $("takk").hidden = false; $("grid").hidden = true; $("bar").hidden = true;
  $("endre").hidden = stengt;
  window.scrollTo(0, 0);
}
$("endre").addEventListener("click", () => {
  $("takk").hidden = true; $("grid").hidden = false; $("bar").hidden = false;
});

const tidligere = lagret();
if (tidligere) {
  $("fornavn").value = tidligere.fornavn; $("etternavn").value = tidligere.etternavn;
  const r = document.querySelector('input[name="gave"][value="' + tidligere.gave + '"]');
  if (r) r.checked = true;
  $("ekstra").value = tidligere.kommentar || "";
  oppdaterValgt();
  visTakk(tidligere);
} else if (stengt) {
  $("bar").hidden = true;
}

$("skjema").addEventListener("submit", async ev => {
  ev.preventDefault();
  const n = valgtNr();
  const fornavn = $("fornavn").value.trim(), etternavn = $("etternavn").value.trim();
  if (stengt) return melding("Fristen har gått ut.", "err");
  if (!n) return melding("Velg en gave først.", "err");
  if (!fornavn || !etternavn) return melding("Fyll inn både fornavn og etternavn.", "err");
  const kommentar = GAVER[n - 1].fritekst ? $("ekstra").value.trim() : "";
  if (GAVER[n - 1].fritekst && !kommentar) return melding("Skriv hvilken organisasjon du vil støtte.", "err");
  const svar = { fornavn, etternavn, gave: n, gaveNavn: GAVER[n - 1].navn, kommentar };

  if (!API) { melding("Forhåndsvisning: ingenting er lagret før Apps Script-URL-en er lagt inn.", "err"); return; }

  $("send").disabled = true; melding("Sender …");
  try {
    // Uten egen Content-Type sendes dette som text/plain, som Apps Script tar imot uten forhåndssjekk.
    const res = await fetch(API, { method: "POST", body: JSON.stringify(svar) });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Ukjent feil");
    lagre(svar); melding(""); visTakk(svar);
  } catch (e) {
    melding("Fikk ikke sendt ønsket. Prøv igjen om litt, eller gi beskjed til Enzo.", "err");
  } finally {
    $("send").disabled = false;
  }
});
</script>
</body>
</html>
